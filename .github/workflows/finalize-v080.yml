name: Finalize App Cartao v0.8.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-v080.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply finalization patch
        run: python3 .github/scripts/finalize_v080.py
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt
          git diff --cached --quiet || git commit -m "Finalize recurring purchase engine"
          git push
