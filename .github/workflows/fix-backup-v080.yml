name: Fix App Cartao v0.8.0 Backup Compatibility

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-backup-v080.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backup status compatibility fix
        run: python3 .github/scripts/fix_backup_compile.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt
          git diff --cached --quiet || git commit -m "Fix backup status compatibility"
          git push
