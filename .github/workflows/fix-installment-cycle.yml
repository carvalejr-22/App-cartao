name: Fix installment billing cycle

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-installment-cycle.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply billing-cycle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/carlos/appcartao/MainActivity.kt')
          text = main.read_text()

          text = text.replace('private const val DATA_VERSION = 2', 'private const val DATA_VERSION = 3')

          old_series = '''private fun buildInstallmentSeries(base: Purchase, count: Int, settings: CardSettings): List<Purchase> {
              val groupId = UUID.randomUUID().toString()
              val result = mutableListOf<Purchase>()
              var period = invoiceForPurchase(base.purchaseDate, settings)
              repeat(count) { index ->
                  val installment = base.copy(
                      id = UUID.randomUUID().toString(),
                      createdAtMillis = base.createdAtMillis + index,
                      installmentGroupId = groupId,
                      installmentNumber = index + 1,
                      installmentTotal = count,
                      invoiceStartEpochDay = null,
                      invoiceEndEpochDay = null,
                      invoiceDueEpochDay = null
                  )
                  result.add(assignToPeriod(installment, period))
                  period = invoiceForPurchase(period.end, settings)
              }
              return result
          }
          '''

          new_series = '''private fun buildInstallmentSeries(base: Purchase, count: Int, settings: CardSettings): List<Purchase> {
              val groupId = UUID.randomUUID().toString()
              val result = mutableListOf<Purchase>()
              var period = invoiceForPurchase(base.purchaseDate, settings)
              repeat(count) { index ->
                  val installment = base.copy(
                      id = UUID.randomUUID().toString(),
                      createdAtMillis = base.createdAtMillis + index,
                      installmentGroupId = groupId,
                      installmentNumber = index + 1,
                      installmentTotal = count,
                      invoiceStartEpochDay = null,
                      invoiceEndEpochDay = null,
                      invoiceDueEpochDay = null
                  )
                  result.add(assignToPeriod(installment, period))
                  period = nextInvoicePeriod(period, settings)
              }
              return result
          }

          private fun nextInvoicePeriod(period: InvoicePeriod, settings: CardSettings): InvoicePeriod {
              val nextMonth = period.end.plusMonths(1)
              val end = dateAtDay(nextMonth.year, nextMonth.monthValue, settings.closingDay)
              val previousMonth = end.minusMonths(1)
              val start = dateAtDay(previousMonth.year, previousMonth.monthValue, settings.closingDay)
              val dueBase = if (settings.dueDay > settings.closingDay) end else end.plusMonths(1)
              val dueDate = dateAtDay(dueBase.year, dueBase.monthValue, settings.dueDay)
              return InvoicePeriod(start = start, end = end, dueDate = dueDate)
          }

          private fun installmentPeriod(
              purchaseDate: LocalDate,
              installmentNumber: Int,
              settings: CardSettings
          ): InvoicePeriod {
              var period = invoiceForPurchase(purchaseDate, settings)
              repeat((installmentNumber - 1).coerceAtLeast(0)) {
                  period = nextInvoicePeriod(period, settings)
              }
              return period
          }
          '''

          if old_series not in text:
              raise SystemExit('buildInstallmentSeries block not found; refusing unsafe patch')
          text = text.replace(old_series, new_series)

          old_migration = '''                if (dataVersion < DATA_VERSION) {
                      val closingDateInPurchaseMonth = dateAtDay(raw.purchaseDate.year, raw.purchaseDate.monthValue, settings.closingDay)
                      if (raw.purchaseDate == closingDateInPurchaseMonth) {
                          raw = raw.copy(
                              invoiceStartEpochDay = null,
                              invoiceEndEpochDay = null,
                              invoiceDueEpochDay = null
                          )
                      } else if (raw.invoiceEndEpochDay != null) {
                          val oldEnd = LocalDate.ofEpochDay(raw.invoiceEndEpochDay)
                          val previousMonth = oldEnd.minusMonths(1)
                          val correctedStart = dateAtDay(previousMonth.year, previousMonth.monthValue, settings.closingDay)
                          raw = raw.copy(invoiceStartEpochDay = correctedStart.toEpochDay())
                      }
                  }

                  add(assignInvoice(raw, settings))
          '''

          new_migration = '''                if (dataVersion < 2) {
                      val closingDateInPurchaseMonth = dateAtDay(raw.purchaseDate.year, raw.purchaseDate.monthValue, settings.closingDay)
                      if (raw.purchaseDate == closingDateInPurchaseMonth) {
                          raw = raw.copy(
                              invoiceStartEpochDay = null,
                              invoiceEndEpochDay = null,
                              invoiceDueEpochDay = null
                          )
                      } else if (raw.invoiceEndEpochDay != null) {
                          val oldEnd = LocalDate.ofEpochDay(raw.invoiceEndEpochDay)
                          val previousMonth = oldEnd.minusMonths(1)
                          val correctedStart = dateAtDay(previousMonth.year, previousMonth.monthValue, settings.closingDay)
                          raw = raw.copy(invoiceStartEpochDay = correctedStart.toEpochDay())
                      }
                  }

                  // v3 corrige parcelamentos históricos que ficaram deslocados uma fatura.
                  // A parcela 1 pertence à primeira fatura determinada pela data real da compra;
                  // as demais avançam exatamente uma fatura por parcela.
                  if (dataVersion < 3 && raw.isInstallment) {
                      val number = raw.installmentNumber ?: 1
                      val correctedPeriod = installmentPeriod(raw.purchaseDate, number, settings)
                      raw = assignToPeriod(
                          raw.copy(
                              invoiceStartEpochDay = null,
                              invoiceEndEpochDay = null,
                              invoiceDueEpochDay = null
                          ),
                          correctedPeriod
                      )
                  }

                  add(assignInvoice(raw, settings))
          '''

          if old_migration not in text:
              raise SystemExit('migration block not found; refusing unsafe patch')
          text = text.replace(old_migration, new_migration)
          main.write_text(text)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 4', 'versionCode = 5')
          g = g.replace('versionName = "0.4.0"', 'versionName = "0.4.1"')
          gradle.write_text(g)

          workflow = Path('.github/workflows/build-apk.yml')
          w = workflow.read_text().replace('name: App-cartao-v0.4.0', 'name: App-cartao-v0.4.1')
          workflow.write_text(w)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/MainActivity.kt app/build.gradle.kts .github/workflows/build-apk.yml
          git commit -m "Fix installment invoice numbering and migration"
          git push
