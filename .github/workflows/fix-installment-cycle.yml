name: Patch modern app compile issue

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-installment-cycle.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove invalid Compose import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt')
          text = path.read_text()
          bad = 'import androidx.compose.foundation.layout.weight\n'
          if bad not in text:
              raise SystemExit('Expected import not found')
          path.write_text(text.replace(bad, '', 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt
          git commit -m "Fix Compose weight import"
          git push
