name: OCR release smoke v0.8.5

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/ocr-device-smoke-v082.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Exercise the bundled OCR from the same minified release code path shipped to the phone.
      - name: Run OCR against minified release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :app:assembleRelease :app:assembleDebugAndroidTest
            keytool -genkeypair -v -keystore /tmp/ocr-ci.jks -storepass android -keypass android -alias ocrci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=OCR CI" >/dev/null 2>&1
            "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)" sign --ks /tmp/ocr-ci.jks --ks-pass pass:android --key-pass pass:android --out /tmp/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
            adb install -r /tmp/app-release-signed.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.carlos.appcartao.ReceiptOcrInstrumentedTest com.carlos.appcartao.test/androidx.test.runner.AndroidJUnitRunner
