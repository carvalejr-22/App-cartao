name: Optimize App Cartao v0.8.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/optimize-v080.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimization patch
        run: python3 .github/scripts/optimize_v080.py
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt README.md
          git diff --cached --quiet || git commit -m "Optimize backup and receipt runtime"
          git push
