name: Refine App Cartao v0.6.1 icons

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refine-v061-icons.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply compact action icon refinement
        run: python3 .github/scripts/refine_v061_icons.py

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt app/build.gradle.kts
          git commit -m "Refine compact invoice action icons"
          git push
