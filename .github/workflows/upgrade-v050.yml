name: Upgrade App Cartao v0.5.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-v050.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v0.5.0 upgrade
        run: python3 tools/upgrade_v050.py

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/java/com/carlos/appcartao app/build.gradle.kts
          git commit -m "Add lightweight multi-card analytics v0.5.0"
          git push
