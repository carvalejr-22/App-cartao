name: Upgrade App Cartao v0.5.1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-v051.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v0.5.1 UX upgrade
        run: python3 -c "import base64;exec(base64.b64decode(' '))"

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/carlos/appcartao/ModernCardActivity.kt
          git commit -m "Clean Home and add safe card removal"
          git push
