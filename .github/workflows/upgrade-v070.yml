name: Upgrade App Cartao v0.7.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-v070.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v0.7.0 upgrade
        run: python3 .github/scripts/upgrade_v070_backup_receipt.py

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic backup and receipt scanning"
          git push
