name: Validate App Cartao v0.7.1

# Revalidated after receipt total-priority fix.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-v071.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Run receipt parser tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build optimized debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Cartao-v0.7.1-validated
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
